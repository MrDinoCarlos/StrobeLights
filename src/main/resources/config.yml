# ==============================================================================
#                              STROBELIGHTS
#                  Invisible 3D RGB lighting for Paper 26.2
# ==============================================================================
# Plugin:      StrobeLights
# Author:      MrDino
# Version:     0.10.5
# Credits:     BradleyQ / Light Painter (3D screen-space lighting foundation)
# Website:     https://mrdino.es/wiki/category/strobelights/
# Discord:     https://discord.gg/ddyfucfZpy
# License:     See THIRD_PARTY_NOTICES.md and the bundled pack license
# ==============================================================================
# Vanilla or OptiFine with Fabulous: full 3D RGB lighting and camera flash.
# OptiFine shaderpacks must be OFF; Fast/Fancy or replaced render pipelines use
# the invisible vanilla white LIGHT fallback.

# Internal schema used to migrate defaults from older releases without deleting
# administrator customizations.
config-version: 3

branding:
  website: 'https://mrdino.es/wiki/category/strobelights/'
  discord: 'https://discord.gg/ddyfucfZpy'

language:
  # English fallback. Player GUIs/messages follow their Minecraft client locale.
  default: 'en'
  use-client-locale: true

resource-pack:
  enabled: true
  required: true
  send-delay-ticks: 10
  # Replace serverip.com with the public server address. Leaving this example
  # URL unchanged produces a red console warning and an admin join title.
  # The HTTP port must differ from Minecraft's and be allowed by the firewall.
  public-url: 'http://serverip.com:8250/strobelights/{token}.zip'
  embedded:
    enabled: true
    bind-address: '0.0.0.0'
    port: 8250

client-compatibility-notices:
  # One short chat notice after the pack loads. A client brand containing
  # OptiFine/OptiFabric gets the specific Fabulous/no-shaderpack reminder. Minecraft
  # does not report its graphics mode, so every other client receives the
  # conditional Fabulous/no-shaderpack hint without claiming detection.
  enabled: false
  delay-ticks: 20

render:
  # 128 blocks, like Light Painter Universal. The technical display remains at
  # the exact saved source and disables client frustum culling, so it can be
  # rendered from above, below and every side without following the camera.
  display-view-range: 128.0
  # RGB light stays visible above, below, on every side and outside the frame.
  # It deliberately does not project screen-space shadows or dark silhouettes.

timing:
  # GUI: normal click changes 1 tick, 20 above 200; Shift changes 100.
  # At this maximum, one more slower click switches the light to STATIC.
  maximum-refresh-ticks: 1200

discovery:
  enabled: true
  # Nearby strobes are shown to this player as steady RGB lights and editable
  # handles only with clear line of sight. They never show through blocks and
  # never change the saved on/off state of the strobes.
  range: 32.0
  minimum-light-level: 10

easy-armor-stands:
  # Soft integration with EasyArmorStands v2 on Paper 26.2.
  # Holding the /eas give tool automatically enables discovery. Moving a
  # StrobeLights handle moves the exact invisible light point.
  enabled: true
  auto-discovery-with-tool: true
  # EasyArmorStands uses the display bounding box for ray selection.
  selection-box-size: 1.0

teleport:
  # Keeps a player just outside a surface-mounted point. Air points use only
  # the vertical offset.
  outward-offset: 1.25
  vertical-offset: 0.25

vanilla-fallback:
  # Real invisible Minecraft light. Fast/Fancy and clients whose rendering
  # mods do not run vanilla post effects still receive visible white lighting.
  # In vanilla Fabulous it is a base while the resource pack adds RGB color.
  enabled: true

flashbang:
  # RGB resource-pack post effect. It uses each strobe's color, does not apply
  # Blindness/Darkness and is sent only to eligible players. Opaque block
  # occlusion is mandatory; glass blocks and panes let the effect through.
  radius: 16.0
  require-looking-at-light: true

throwable-flashbang:
  # /strobe flash give <player>. Every throw is fixed at white RGB, 15/15
  # scene light, EXTREME screen flash and 200% configured flash power.
  throw-velocity: 1.35
  # Fuse begins when the projectile hits a block or entity. 20 ticks = 1 s.
  detonation-delay-ticks: 20
  # Failsafe only: if no impact event ever arrives, the projectile still
  # detonates at its last position. 1200 ticks = 60 seconds, leaving ample
  # time for throws from unusual heights to reach the ground normally.
  maximum-flight-ticks: 1200
  # Unconditional vanilla cue at the physical impact. Unlike blindness, it is
  # not cancelled when every player is outside the effect radius, is looking
  # away or has no resource pack. Volume 8 carries roughly 128 blocks.
  detonation-cue-volume: 8.0
  detonation-cue-pitch: 1.6
  # Within full-effect-distance the camera flash uses its maximum strength and
  # maximum duration. Both decrease smoothly to zero at radius, so nearby
  # players stay blinded longer than distant players. 20 ticks = 1 s.
  radius: 24.0
  full-effect-distance: 5.0
  effect-falloff-exponent: 1.2
  maximum-screen-flash-duration-ticks: 100
  # The white 3D light is independent of the directional camera flash. A
  # player looking away can still see the environment light up.
  # Players can see the fixed environmental pulse independently of the
  # 24-block camera-blindness radius. It is capped by display-view-range.
  scene-view-range: 128.0
  # Kept long enough for both the shader and vanilla light engine to show the
  # floor and surrounding area, including to players looking away.
  scene-light-duration-ticks: 60
  require-looking-at-light: true
  # Custom strobelights:flashbang sound. 4.0 is the current maximum volume at
  # close range; it fades independently to silence at sound-radius.
  sound-radius: 32.0
  full-volume-distance: 5.0
  sound-falloff-exponent: 1.0
  sound-volume: 4.0
  sound-pitch: 1.0

flare:
  # /strobe flare give <player>. Left click opens the cartridge menu; choosing
  # a color plays the loading animation. Right click launches the loaded flare.
  # true: one cartridge is consumed by every shot (default single-shot mode).
  # false: the selected color remains loaded and can be fired repeatedly.
  reload-required: true
  load-duration-ticks: 34
  fire-cooldown-ticks: 12
  # The view direction is tilted upward by vertical-bias and then clamped to
  # minimum-upward-direction so every shot reaches the sky.
  launch-speed: 1.7
  vertical-bias: 0.65
  minimum-upward-direction: 0.25
  # Vertical blocks above the launch point where the flare explodes.
  launch-height: 28.0
  maximum-flight-ticks: 200
  flight-drag: 0.99
  flight-gravity: 0.012
  explode-on-collision: true
  # The projectile already lights nearby terrain before the main flare ignites.
  flight-light-level: 15
  flight-light-expansion: 2.0
  launch-sound-volume: 4.0
  launch-sound-pitch: 1.0
  # A smooth halo and white-hot core follow the shot and replace vanilla particles.
  visual:
    flight-size: 0.8
    burn-size: 3.2
    view-range: 192.0
  explosion:
    # 800 ticks = 40 seconds. The light follows the slowly descending core.
    burn-duration-ticks: 800
    fall-speed: 0.035
    drift-speed: 0.012
    sway-strength: 0.005
    sway-frequency: 0.09
    sound-volume: 6.0
    sound-pitch: 1.0
    # Colored 3D light from the resource pack plus the vanilla white fallback.
    scene-light-duration-ticks: 800
    scene-light-level: 15
    scene-light-expansion: 4.0
    scene-view-range: 128.0
    screen-flash:
      enabled: true
      radius: 96.0
      full-effect-distance: 12.0
      falloff-exponent: 0.85
      # Direct gaze refreshes the glare; looking away leaves this afterimage.
      minimum-view-dot: 0.72
      view-falloff-exponent: 0.6
      maximum-duration-ticks: 80
      strength-percent: 135
      require-looking-at-light: true

limits:
  maximum-strobes: 256
  maximum-name-length: 32
  maximum-group-name-length: 32
